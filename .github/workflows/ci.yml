name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server:
    name: Server — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        working-directory: .

      - run: npm run lint
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run test -- --run
      - run: npm run build

  client:
    name: Client — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        working-directory: .

      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test -- --run
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api/v1
          VITE_SOCKET_URL: http://localhost:5000

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t collabnote-server .
      - name: Build client image
        run: docker build -f client/Dockerfile -t collabnote-client . --build-arg VITE_API_URL=http://localhost:5000/api/v1 --build-arg VITE_SOCKET_URL=http://localhost:5000
